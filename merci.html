<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Traitor — Merci</title>
  <meta name="robots" content="noindex" />
  <style>
    :root{--bg:#07070a;--line:#1d1f2a;--text:#e9e9ef;--muted:#a8a9b6;}
    body{margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:var(--text);
      background:radial-gradient(1200px 600px at 20% 0%, #141526 0%, var(--bg) 55%) no-repeat,
                 radial-gradient(900px 500px at 90% 10%, #161028 0%, var(--bg) 55%) no-repeat,var(--bg);}
    .card{max-width:720px;width:calc(100% - 40px);padding:26px 24px;border:1px solid var(--line);
      border-radius:20px;background:rgba(255,255,255,0.03);box-shadow:0 20px 60px rgba(0,0,0,.45)}
    h1{margin:0 0 10px;font-size:26px}
    p{margin:8px 0;color:var(--muted);line-height:1.6}
    .btn{display:inline-block;margin-top:14px;padding:12px 14px;border-radius:14px;
      border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);
      color:var(--text);text-decoration:none;font-weight:700}
    .btn:hover{filter:brightness(1.06)}
    .small{font-size:12px;color:var(--muted);margin-top:10px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Inscription reçue ✅</h1>
    <p>Merci ! Ton inscription à <b>The Traitor</b> est bien enregistrée.</p>
    <p>Tu vas recevoir un email avec la suite (accès bêta + instructions). Pense à vérifier tes spams si tu ne vois rien dans quelques minutes.</p>
    <a class="btn" href="./">Retour à l’accueil</a>
    <div class="small">© The Traitor — bêta</div>
  </div>
</body>
</html>
